# Only github-actions: the C++ has no package manager, and pico-sdk, picotool,
# imgui and stb are cloned by the workflows and raised by hand. A third-party
# action runs with this repository's token, so keeping its version current matters.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
