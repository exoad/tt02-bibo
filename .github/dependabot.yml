# Dependabot. One ecosystem, and it is not the C++ - there is no package manager
# here. The SDKs (pico-sdk and picotool by tag in workflows/firmware.yml, imgui
# and stb by the clones in third_party/) are pinned by hand and invisible to
# Dependabot, so raising one is a person's job. github-actions is what is left,
# and it matters: a third-party action runs with this repository's token, and
# those pinned versions are the only thing standing between a compromised action
# and it.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
