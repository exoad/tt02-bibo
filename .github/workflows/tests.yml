# The host suites: firmware/lib's and the pilot's on Linux under two compilers,
# and the viewer's link suite on Windows.
#
# WHY LINUX for a Windows project: firmware/lib's suites are the half that needs
# no board - text, pins, control, pursuit, the DFPlayer checksum, sfx, and
# chassis with the fake HAL. None of it is MSVC-specific, and a Linux runner bills
# at 1x where a Windows runner bills at 2x. TWO COMPILERS because MSVC is what hid
# `Int32 main()`: int32_t is `int` there and `long int` on arm-none-eabi, so
# twenty entry points compiled clean on the host and the board rejected three.
name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: compiler version
        run: ${{ matrix.cxx }} --version

      - name: build and run
        run: sh tools/host_tests.sh run ${{ matrix.cxx }} -O2 -Wall -Wextra

  # The pilot's suites under ctest. This is the only build of the pilot's Linux
  # halves - viewfeed's sockets, the camera - that does not need the board: MSVC
  # and mingw compile their refusing halves only.
  pilot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S firmware/pilot -B build-pilot -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: build
        run: cmake --build build-pilot -j

      - name: test
        run: ctest --test-dir build-pilot --output-on-failure

  # The viewer is Win32 and MSVC, so its link suite needs the Windows runner. It
  # goes through tools\test.bat, the same runner a desk uses.
  viewer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # third_party/ is gitignored and cloned; the versions are in THIRD_PARTY.md.
      - name: third_party
        shell: bash
        run: |
          git clone --depth 1 --branch v1.92.9 https://github.com/ocornut/imgui.git third_party/imgui
          git clone --depth 1 https://github.com/nothings/stb.git third_party/stb

      - name: link suite
        shell: cmd
        run: call tools\test.bat link run
