# The style checker. It reports and never rewrites.
#
# tools/format.py enforces call wrapping, `=` padding and the blank-line rules B1-B4, all
# fixable with --apply. Its report goes to the job summary, the first thing on the run's
# page, and to an artifact for a report longer than a summary holds.
name: style

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # continue-on-error and an explicit failure at the end, or the job stops here and
      # never writes the summary.
      - name: check
        id: check
        continue-on-error: true
        run: python tools/format.py --markdown format-report.md
      - name: summary
        if: always()
        run: cat format-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format-report
          path: format-report.md
          if-no-files-found: warn
      - name: fail if the report found anything
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error title=style::tools/format.py found violations - run it with --apply"
          exit 1

  # tools/style_audit.py: naming, layout, include direction and stray files, none of it
  # fixed automatically.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: style audit
        run: python tools/style_audit.py
