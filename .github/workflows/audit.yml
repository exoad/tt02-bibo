# The style audit, and the stray-file guard: it catches a 75 GB file in the
# repository root, which `git status` lists in the same `??` column as a
# directory somebody meant to add. Cheapest job here, so it runs on everything.
name: audit

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The audit asks git for untracked files, so it needs a real checkout.
      - name: style audit
        run: python hub/tools/style_audit.py
