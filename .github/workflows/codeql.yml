# CodeQL analyses what the build step compiles: firmware/lib's host suites and the headers
# they include. Not covered: viewer/src (MSVC and D3D11), firmware/pilot, and the
# arm-none-eabi-only parts of firmware/lib. build-mode is manual because autobuild would find
# the root CMakeLists.txt, which builds nothing, and pass having analysed nothing.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly: what counts as a vulnerability changes even when this repo does not.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # The analyze step reads its own run when it uploads; without this it analyses, then fails
  # with "Resource not accessible".
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      # -O0 -g: optimisation can delete the code path a query looks for.
      - name: build what is being analysed
        run: sh tools/host_tests.sh build g++ -O0 -g
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
