# CodeQL, the vulnerability scanner proper. It analyses what a build COMPILES, so
# its coverage is exactly the build command below: the seven host suites and the
# firmware/lib headers they include. NOT covered: hub/src, which needs MSVC and
# D3D11 on a Windows runner, and the arm-none-eabi-only parts of firmware/lib.
# build-mode is manual because autobuild would find the root CMakeLists, try to
# configure the Windows project on Linux, and half-succeed - analysing a fraction
# of the tree while reporting success.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly: what counts as a vulnerability changes even when this repo does not.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # The analyze step asks the API about its own run when it uploads. Without this
  # it finishes the analysis and THEN dies with "Resource not accessible".
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          # Superset of the default: adds the uninitialised-value and dead-store
          # quality queries.
          queries: security-and-quality

      # -O0 -g: optimisation can delete the very code path a query looks for.
      - name: build what is being analysed
        run: |
          set -eu
          mkdir -p out
          for src in firmware/tests/test_*.cxx; do
            name=$(basename "$src" .cxx)
            defs=""
            if [ "$name" = "test_chassis" ]; then defs="-DBIBO_FAKE_HAL"; fi
            g++ -std=c++20 -O0 -g $defs -I firmware/lib -o "out/$name" "$src"
          done
          ls -1 out | sed 's/^/  compiled /'

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
