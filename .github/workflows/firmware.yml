# Both boards, cross-compiled for RP2350, on a Linux runner. firmware\build.bat
# is Windows-only, so CI drives cmake directly with the flags build.bat passes -
# keep the two in step.
#
# BOTH BOARDS: pico2_w has the CYW43 and pico2 does not, and BIBO_WIRELESS comes
# from the board header, not the board's name. Clean build and no ccache: one
# reporting zero warnings because it never recompiled the file that warns is how
# this project has been told it was green when it was not.
name: firmware

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: "latest" turns an SDK release into a change nobody made or can diff.
  PICO_SDK_TAG: '2.1.1'
  PICOTOOL_TAG: '2.1.1'

jobs:
  boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pico2_w, pico2]
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib build-essential pkg-config libusb-1.0-0-dev
          arm-none-eabi-gcc --version | head -1

      # vendor/ is gitignored - the SDK is fetched the way a desk fetches it.
      - name: pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_TAG }}
          path: vendor/pico-sdk
          submodules: recursive

      # The SDK needs picotool to make a .uf2; picotool_DIR is build.bat's argument.
      - name: picotool
        run: |
          git clone --depth 1 --branch "$PICOTOOL_TAG" \
            https://github.com/raspberrypi/picotool.git /tmp/picotool
          cmake -S /tmp/picotool -B /tmp/picotool/build -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/vendor/pico-sdk" \
            -DCMAKE_INSTALL_PREFIX=/tmp/picotool/install
          cmake --build /tmp/picotool/build --target install

      - name: configure
        run: |
          cmake -S firmware -B "firmware/build-${{ matrix.board }}" -G Ninja \
            -DPICO_BOARD=${{ matrix.board }} \
            -Dpicotool_DIR=/tmp/picotool/install/share/picotool \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/vendor/pico-sdk

      # Errors counted FIRST, warnings only when errors is 0. A warning count from
      # a build that failed before reaching the file is true and meaningless.
      - name: build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/vendor/pico-sdk
        run: |
          set -o pipefail
          cmake --build "firmware/build-${{ matrix.board }}" 2>&1 | tee build.log

      - name: warnings must be zero
        run: |
          warns=$(grep -c ': warning:' build.log || true)
          echo "  $warns warning(s)"
          if [ "$warns" -ne 0 ]; then
            grep ': warning:' build.log | head -40
            echo "::error title=warnings::$warns warning(s) building ${{ matrix.board }}"
            exit 1
          fi

      # Measure the ARTIFACT, not the return code: a build that "succeeded"
      # without producing a .uf2 is the failure this project keeps meeting.
      - name: images must exist
        run: |
          n=$(find "firmware/build-${{ matrix.board }}" -maxdepth 1 -name '*.uf2' | wc -l)
          find "firmware/build-${{ matrix.board }}" -maxdepth 1 -name '*.uf2' -printf '  %f  %s bytes\n'
          if [ "$n" -eq 0 ]; then
            echo "::error title=no image::build reported success and produced no .uf2"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build-${{ matrix.board }}/*.uf2
            firmware/build-${{ matrix.board }}/*.elf
          if-no-files-found: error
