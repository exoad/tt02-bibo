# The hub, and everything that only builds under MSVC. The one Windows job and
# the only one billed at 2x - everything that can run on Linux already does
# (tests.yml). bibo.exe is Win32 and Direct3D 11, and the rplidar driver ships as
# a Visual Studio solution. The firmware suites run here too for what MSVC hides:
# int32_t is `int` there and `long int` on arm-none-eabi, which is how twenty host
# entry points compiled clean while the board rejected three. The .bat files must
# reach VS through tools\find_vs.bat - they hard-coded the Community path once,
# and these runners carry Enterprise, so all twenty-two failed with
# "vcvarsall.bat is not recognized".
name: hub

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # vendor/ is gitignored, and hub\build.bat expects the SDK at exactly this
      # path and builds rplidar_driver.lib from it on first run.
      - name: rplidar sdk
        uses: actions/checkout@v4
        with:
          repository: Slamtec/rplidar_sdk
          path: vendor/rplidar_sdk
          submodules: recursive

      # hub/third_party/ is gitignored too; build.bat compiles imgui.cpp and the
      # win32/dx11 backends from here. PINNED to what the desk builds against:
      # the hub tracks 1.92.x, where SetWindowFontScale was removed.
      - name: dear imgui
        uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          ref: v1.92.9
          path: hub/third_party/imgui

      - name: which Visual Studio
        shell: cmd
        run: |
          call tools\find_vs.bat || exit /b 1
          echo VSROOT=%VSROOT%

      - name: build bibo.exe
        shell: cmd
        run: hub\build.bat

      - name: the executable must exist
        shell: cmd
        run: |
          if not exist "hub\build\bibo.exe" (
            echo ::error title=no exe::build reported success and produced no bibo.exe
            exit /b 1
          )
          dir "hub\build\bibo.exe"

      # EXIT CODES, never output: every one of these printed "OVERALL: FAIL" while
      # exiting 0 until 2026-08-31, because `exit /b %errorlevel%` in an if-block
      # expands when cmd PARSES it, before the test has run.
      #
      # THREE SUITES ARE DELIBERATELY ABSENT because they test this machine, not
      # this code: build_test.bat opens COM7 to a real RPLIDAR C1, build_pico_test
      # opens COM10 to a real Pico, build_devlink_test enumerates the machine's
      # ACTUAL serial ports. A runner has none, so all three redden a good tree.
      - name: hub suites
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FAIL=0
          for %%s in (diagnostics editor geom json lights lint lsp) do (
            call hub\tests\build_%%s_test.bat run >nul 2>&1
            if errorlevel 1 (
              echo   [FAIL] %%s
              set FAIL=1
            ) else (
              echo   [ ok ] %%s
            )
          )
          exit /b !FAIL!

      - name: firmware suites under MSVC
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FAIL=0
          for %%s in (chassis control dfplayer pins pursuit sfx text) do (
            call firmware\tests\build_%%s_test.bat run >nul 2>&1
            if errorlevel 1 (
              echo   [FAIL] %%s
              set FAIL=1
            ) else (
              echo   [ ok ] %%s
            )
          )
          exit /b !FAIL!

      - name: pilot suites
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FAIL=0
          for %%s in (pilot proto) do (
            call firmware\pilot\tests\build_%%s_test.bat run >nul 2>&1
            if errorlevel 1 (
              echo   [FAIL] %%s
              set FAIL=1
            ) else (
              echo   [ ok ] %%s
            )
          )
          exit /b !FAIL!

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bibo-exe
          path: hub/build/bibo.exe
          if-no-files-found: warn
