# The hub, and everything that only builds under MSVC.
#
# The one Windows job, and the only one billed at 2x. Everything that could
# reasonably run on Linux already does - see tests.yml, which runs the seven
# firmware suites under g++ and clang++ for a fifth of the cost. What is left
# here genuinely cannot: bibo.exe is Win32 and Direct3D 11, and the rplidar
# driver ships as a Visual Studio solution.
#
# THIS JOB EXISTS BECAUSE OF WHAT MSVC HIDES, not despite it. int32_t is `int`
# on MSVC and `long int` on arm-none-eabi, which is how twenty host entry points
# compiled clean while the board rejected three. The suites are run under BOTH
# front ends for the same reason a second pair of eyes is worth having.
#
# It became possible on 2026-09-01. Before that every .bat here named
#
#     C:\Program Files\Microsoft Visual Studio\2022\Community
#
# and these runners carry Enterprise, so all twenty-two failed with
# "vcvarsall.bat is not recognized" - a wrong path that reads like a broken
# build. tools\find_vs.bat asks vswhere instead.
name: hub

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # vendor/ is gitignored - the SDK is not part of this repository, and
      # hub\build.bat expects it at exactly this path and builds
      # rplidar_driver.lib from it on first run.
      - name: rplidar sdk
        uses: actions/checkout@v4
        with:
          repository: Slamtec/rplidar_sdk
          path: vendor/rplidar_sdk
          submodules: recursive

      - name: which Visual Studio
        shell: cmd
        run: |
          call tools\find_vs.bat || exit /b 1
          echo VSROOT=%VSROOT%

      - name: build bibo.exe
        shell: cmd
        run: hub\build.bat

      - name: the executable must exist
        shell: cmd
        run: |
          if not exist "hub\build\bibo.exe" (
            echo ::error title=no exe::build reported success and produced no bibo.exe
            exit /b 1
          )
          dir "hub\build\bibo.exe"

      # EXIT CODES, never output. Every one of these printed "OVERALL: FAIL"
      # while exiting 0 until 2026-08-31 - `exit /b %errorlevel%` inside an
      # if-block expands when cmd PARSES the block, before the test has run.
      #
      # hub\tests\build_test.bat is NOT in this list and must not be. It is a
      # hardware test: it opens COM7 at 460800 and talks to a real RPLIDAR C1.
      # On a runner it fails with "COM7 is gone", which is the correct answer to
      # the wrong question.
      - name: hub suites
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FAIL=0
          for %%s in (devlink diagnostics editor geom json lights lint lsp pico) do (
            call hub\tests\build_%%s_test.bat run >nul 2>&1
            if errorlevel 1 (
              echo   [FAIL] %%s
              set FAIL=1
            ) else (
              echo   [ ok ] %%s
            )
          )
          exit /b !FAIL!

      - name: firmware suites under MSVC
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FAIL=0
          for %%s in (chassis control dfplayer pins pursuit sfx text) do (
            call firmware\tests\build_%%s_test.bat run >nul 2>&1
            if errorlevel 1 (
              echo   [FAIL] %%s
              set FAIL=1
            ) else (
              echo   [ ok ] %%s
            )
          )
          exit /b !FAIL!

      - name: pilot suites
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FAIL=0
          for %%s in (pilot proto) do (
            call pilot\tests\build_%%s_test.bat run >nul 2>&1
            if errorlevel 1 (
              echo   [FAIL] %%s
              set FAIL=1
            ) else (
              echo   [ ok ] %%s
            )
          )
          exit /b !FAIL!

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bibo-exe
          path: hub/build/bibo.exe
          if-no-files-found: warn
