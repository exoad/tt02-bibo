# cppcheck and clang-tidy, apart from codeql.yml: CodeQL follows data across functions, these
# read the code in front of them. clang-tidy uses .clang-tidy and firmware/.clang-tidy, so CI
# and the editor report the same rules.
name: analysis

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version
      # Only firmware/lib and firmware/app: vendor/ and third_party/ are not ours to fix.
      # --inline-suppr, so a false positive is waived at its line.
      # useStlAlgorithm: the firmware is freestanding, and <algorithm> is not there.
      # knownConditionTrueFalse: cppcheck explores #ifdef combinations the build never has,
      # such as hal.hxx without the board header that defines CYW43_WL_GPIO_LED_PIN.
      - name: cppcheck
        run: |
          set -o pipefail
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --std=c++20 \
            --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=useStlAlgorithm \
            --suppress=knownConditionTrueFalse \
            --error-exitcode=2 \
            -I firmware/lib \
            firmware/lib firmware/app \
            2>&1 | tee cppcheck.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck.log
          if-no-files-found: warn

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy
          clang-tidy --version
      # Over the host suites, not the headers: aimed at a header, clang-tidy fails on
      # `pico/stdlib.h`, checks a fraction of the file and still exits 0. .clang-tidy's
      # HeaderFilterRegex reports what the suites include. A suite it cannot parse fails the
      # step, since its zero findings would mean nothing.
      - name: clang-tidy
        run: |
          parsed=0
          sh tools/host_tests.sh tidy > tidy.log || parsed=$?
          n=$(grep -c ': warning:' tidy.log || true)
          echo "  $n finding(s)"
          if [ "$n" -ne 0 ]; then
            grep ': warning:' tidy.log | head -40
            echo "::error title=clang-tidy::$n finding(s) under the repository's own check list"
            exit 1
          fi
          exit $parsed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-tidy-report
          path: tidy.log
          if-no-files-found: warn
