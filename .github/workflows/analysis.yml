# Static analysis: cppcheck, and this repository's own clang-tidy list.
#
# Separate from codeql.yml because they answer different questions. CodeQL
# follows data across functions looking for a path from an input to a hazard;
# cppcheck and clang-tidy read the code in front of them. The overlap is small
# and the cheap one runs in about a minute.
#
# THE CLANG-TIDY STEP RUNS THIS REPOSITORY'S OWN CONFIG rather than a list
# invented here. .clang-tidy at the root and firmware/.clang-tidy below it are
# what the hub's Code view and CLion already enforce as you type, so CI agreeing
# with the editor is the whole point - a rule that only fires in CI gets
# committed around, and a rule that only fires in the editor decays.
name: analysis

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version

      # vendor/ is upstream and hub/third_party holds imgui - neither is ours to
      # fix, and their findings would sit in the same list as a real one. Same
      # exclusion the style audit makes, for the same reason.
      #
      # --inline-suppr so a genuine false positive can be waived AT THE LINE,
      # where the next reader sees why, rather than in a list far away.
      - name: cppcheck
        run: |
          set -o pipefail
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --std=c++20 \
            --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inconclusive \
            --error-exitcode=2 \
            -I firmware/lib \
            firmware/lib firmware/app shared lidar/bridge \
            2>&1 | tee cppcheck.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck.log
          if-no-files-found: warn

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy
          clang-tidy --version

      # The test translation units, because they are what pulls firmware/lib in
      # with a compiler that can actually parse it - BIBO_FAKE_HAL swaps the SDK
      # half out. Running clang-tidy at the headers directly instead makes it
      # parse `pico/stdlib.h`, fail, and report on a fraction of the file while
      # still exiting 0.
      #
      # HeaderFilterRegex in .clang-tidy is what keeps the report to our own
      # headers, so the count below is of findings in this repository.
      - name: clang-tidy
        run: |
          set -u
          : > tidy.log
          for src in firmware/tests/test_*.cxx; do
            defs=""
            if [ "$(basename "$src" .cxx)" = "test_chassis" ]; then defs="-DBIBO_FAKE_HAL"; fi
            clang-tidy --quiet "$src" -- -std=c++20 $defs -I firmware/lib >> tidy.log 2>/dev/null || true
          done

          n=$(grep -c ': warning:' tidy.log || true)
          echo "  $n finding(s)"
          if [ "$n" -ne 0 ]; then
            grep ': warning:' tidy.log | head -40
            echo "::error title=clang-tidy::$n finding(s) under the repository's own check list"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clang-tidy-report
          path: tidy.log
          if-no-files-found: warn
