# Static analysis: cppcheck, and this repository's own clang-tidy list.
#
# Separate from codeql.yml: CodeQL follows data across functions, these two read
# the code in front of them. clang-tidy runs .clang-tidy and firmware/.clang-tidy
# so CI agrees with the editor - a rule that fires in only one of them decays.
name: analysis

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version

      # vendor/ and hub/third_party (imgui) are upstream - not ours to fix, and
      # their findings would crowd out a real one. --inline-suppr so a genuine
      # false positive can be waived AT THE LINE rather than in a list far away.
      #
      # useStlAlgorithm      wants std::find_if and std::fill, but the firmware is
      #                      FREESTANDING - no heap, no exceptions, no <algorithm>
      #                      - so each finding advises a header that is not there.
      # knownConditionTrueFalse
      #                      cppcheck explores #ifdef combinations the real build
      #                      never has. It called `!bibo::net::present()` both
      #                      "always false" AND "always true" on the SAME line,
      #                      because BIBO_WIRELESS comes from the board header.
      # --inconclusive       removed, not suppressed: both findings it produced
      #                      were "this member could be static".
      - name: cppcheck
        run: |
          set -o pipefail
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --std=c++20 \
            --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=useStlAlgorithm \
            --suppress=knownConditionTrueFalse \
            --error-exitcode=2 \
            -I firmware/lib \
            firmware/lib firmware/app shared lidar/bridge \
            2>&1 | tee cppcheck.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck.log
          if-no-files-found: warn

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy
          clang-tidy --version

      # The test translation units, because they pull firmware/lib in with a
      # compiler that can parse it - BIBO_FAKE_HAL swaps the SDK half out. Aimed
      # at the headers directly, clang-tidy fails on `pico/stdlib.h`, reports on a
      # fraction of the file and still exits 0. HeaderFilterRegex keeps the count.
      - name: clang-tidy
        run: |
          set -u
          : > tidy.log
          for src in firmware/tests/test_*.cxx; do
            defs=""
            if [ "$(basename "$src" .cxx)" = "test_chassis" ]; then defs="-DBIBO_FAKE_HAL"; fi
            clang-tidy --quiet "$src" -- -std=c++20 $defs -I firmware/lib >> tidy.log 2>/dev/null || true
          done

          n=$(grep -c ': warning:' tidy.log || true)
          echo "  $n finding(s)"
          if [ "$n" -ne 0 ]; then
            grep ': warning:' tidy.log | head -40
            echo "::error title=clang-tidy::$n finding(s) under the repository's own check list"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-tidy-report
          path: tidy.log
          if-no-files-found: warn
